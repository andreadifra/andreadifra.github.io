<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Hurdle models compared with zero-inflated models</title>
  <desc id="desc">A hand-drawn comparison diagram showing that zero-inflated models treat zeros as structural or sampling zeros, while hurdle models put all zeros in a single zero process and positives in a truncated count process.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#263238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill: #fffdf7; stroke: #263238; stroke-width: 2.4; rx: 14; }
      .zi { fill: #dff6f8; stroke: #168491; }
      .hu { fill: #fff1d9; stroke: #aa6b00; }
      .line { fill: none; stroke: #263238; stroke-width: 2.2; stroke-linecap: round; marker-end: url(#arrow); }
      text { font-family: "Segoe Print", "Bradley Hand ITC", "Comic Sans MS", sans-serif; fill: #202124; }
      .h { font-size: 21px; font-weight: 700; }
      .t { font-size: 16px; }
    </style>
  </defs>
  <rect x="42" y="72" width="168" height="70" class="box"/>
  <text x="126" y="101" text-anchor="middle" class="h">Observed zero</text>
  <text x="126" y="124" text-anchor="middle" class="t">Y = 0</text>
  <rect x="42" y="224" width="168" height="70" class="box"/>
  <text x="126" y="253" text-anchor="middle" class="h">Positive count</text>
  <text x="126" y="276" text-anchor="middle" class="t">Y &gt; 0</text>
  <path d="M214 106 C254 92, 284 88, 328 88" class="line"/>
  <path d="M214 106 C254 126, 284 144, 328 160" class="line"/>
  <path d="M214 258 C254 232, 284 214, 328 196" class="line"/>
  <path d="M214 258 C254 274, 284 286, 328 304" class="line"/>
  <rect x="332" y="50" width="260" height="76" class="box zi"/>
  <text x="462" y="80" text-anchor="middle" class="h">Zero-inflated</text>
  <text x="462" y="104" text-anchor="middle" class="t">structural or sampling zero</text>
  <rect x="332" y="142" width="260" height="76" class="box hu"/>
  <text x="462" y="172" text-anchor="middle" class="h">Hurdle</text>
  <text x="462" y="196" text-anchor="middle" class="t">one process determines zeros</text>
  <rect x="332" y="266" width="260" height="76" class="box hu"/>
  <text x="462" y="296" text-anchor="middle" class="h">Hurdle positives</text>
  <text x="462" y="320" text-anchor="middle" class="t">truncated count distribution</text>
  <rect x="682" y="142" width="250" height="76" class="box zi"/>
  <text x="807" y="172" text-anchor="middle" class="h">Zero-inflated positives</text>
  <text x="807" y="196" text-anchor="middle" class="t">standard count distribution</text>
  <path d="M594 88 C652 92, 674 118, 700 142" class="line"/>
  <path d="M594 304 C656 282, 686 240, 718 218" class="line"/>
</svg>
